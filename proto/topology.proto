syntax = "proto3";

package seamless_swarm;

enum TaskCategory {
  STATELESS_IDEMPOTENT = 0;
  STATEFUL_LONG_RUNNING = 1;
  INTERACTIVE_LOW_LATENCY = 2;
}

enum TaskStatus {
  PENDING = 0;
  RUNNING = 1;
  COMPLETED = 2;
  FAILED = 3;
}

message HardwareIdentity {
  string node_uuid = 1;
  bytes ecdsa_public_key = 2;
  bytes static_thumbprint = 3;
}

message HandshakeChallenge {
  bytes high_entropy_token = 1;
  uint64 timestamp = 2;
}

message HandshakeResponse {
  bytes signature = 1;
  HardwareIdentity identity = 2;
}

message HandshakeResult {
  bool authenticated = 1;
  string session_token = 2;
  string message = 3;
}

message DeviceCapability {
  string resource_name = 1;
  string value_type = 2;
  oneof resource_value {
    int64 int_val = 3;
    double double_val = 4;
    string string_val = 5;
    bool bool_val = 6;
  }
}

message CapabilityProfile {
  string node_id = 1;
  string os_platform = 2;
  repeated DeviceCapability capabilities = 3;
  uint64 updated_timestamp = 4;
}

message TaskDefinition {
  string task_id = 1;
  TaskCategory category = 2;
  string module_target = 3;
  bytes payload = 4;
  uint32 max_retries = 5;
  uint32 timeout_ms = 6;
  repeated string required_capabilities = 7;
}

message TaskProgress {
  string task_id = 1;
  TaskStatus status = 2;
  float progress_percentage = 3;
  bytes checkpoint_data = 4;
  string error_message = 5;
}
