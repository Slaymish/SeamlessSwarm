[package]
name = "seamless-node"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "seamless-node"
path = "src/main.rs"

[dependencies]
compute-module-core = { path = "../compute-module-core" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
socket2 = "0.5"
nng = "1.0"
prost = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "sha256"] }
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
log = "0.4"
env_logger = "0.10"

[build-dependencies]
prost-build = "0.12"

[dev-dependencies]
prost = "0.12"
nng = "1.0"
