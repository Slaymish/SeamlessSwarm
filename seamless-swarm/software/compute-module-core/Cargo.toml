[package]
name = "compute-module-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
p256 = { version = "0.13", features = ["ecdsa", "sha256"] }
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
prost = "0.12"

[build-dependencies]
prost-build = "0.12"
